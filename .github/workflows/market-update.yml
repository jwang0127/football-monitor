name: Sporttery market update

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: "Sporttery business date (YYYYMMDD); empty means China date"
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect and build
        env:
          BUSINESS_DATE: ${{ inputs.business_date }}
        run: |
          if [ -n "$BUSINESS_DATE" ]; then
            python auto_market_update.py --date "$BUSINESS_DATE"
          else
            python auto_market_update.py
          fi

      - name: Commit generated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_snapshots_*.jsonl output/market_tracking_*.md 202*/ index.html
          git diff --cached --quiet || git commit -m "Auto-update Sporttery market snapshot"
          git push
